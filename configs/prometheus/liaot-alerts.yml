groups:
  - name: liaot-observability
    rules:
      - alert: LiaoTHigh5xxRate
        expr: |
          sum(rate(liaot_http_requests_total{status_class="5xx"}[5m]))
          /
          clamp_min(sum(rate(liaot_http_requests_total[5m])), 1)
          > 0.01
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "LiaoT API 5xx rate is above 1%"
          description: "Investigate liaot-api logs, DB connectivity, Redis, and recent deployments."

      - alert: LiaoTAdminLoginFailures
        expr: increase(liaot_events_total{event="admin_login_failed"}[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LiaoT admin login failures detected"
          description: "More than 5 failed admin logins in 5 minutes. Check audit logs and nginx access logs."

      - alert: LiaoTCspViolation
        expr: increase(liaot_events_total{event="csp_violation"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "LiaoT CSP violation reported"
          description: "Could be XSS probing or a legitimate resource missing from CSP. Review /api/csp-report logs."

      - alert: LiaoTHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(liaot_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LiaoT API p95 latency above 2 seconds"
          description: "Check DB slow queries, MinIO, Redis, CPU, and recent traffic spikes."
