# LiaoT rate-limit and connection-limit zones.
# Referenced by /etc/nginx/sites-available/liaot. If you change zone
# names here, update the vhost config to match.
#
# Sizes:
#   - 10m of zone state stores roughly 160k unique source IPs.
#
# Rates:
#   - api_auth (30r/m): tight on credential endpoints.
#   - api_general (300r/m): loose on data endpoints for normal chat bursts.
#   - conn_per_ip: caps concurrent connections per IP.
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
