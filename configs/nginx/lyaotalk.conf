# /etc/nginx/sites-available/lyaotalk
#
# Rate limit + connection limit zones live in /etc/nginx/conf.d/lyaotalk-rate-limit.conf
# (created by install.sh). Zones referenced here:
#   - api_auth:    tight (30r/m) for credential endpoints
#   - api_general: loose (300r/m) for everything else under /api/
#   - conn_per_ip: connection cap per source IP (slowloris defense)
#
# If nginx fails to start with "unknown limit_req zone", verify
# /etc/nginx/conf.d/lyaotalk-rate-limit.conf exists and is included from
# /etc/nginx/nginx.conf's http {} block.

# The location picker serves OpenStreetMap tiles through a bounded cache so
# browsers in mainland China do not need a direct connection to OSMF.
# OSMF requires an identifiable User-Agent and cached responses.
proxy_cache_path /var/cache/nginx/lyaotalk-osm levels=1:2 keys_zone=lyaotalk_osm:10m max_size=2g inactive=30d use_temp_path=off;

# Default-server block: catch requests with mismatched Host header.
# Without this, an attacker sending Host: evil.com that resolves to our IP
# would still hit our application — and our HSTS / CSP headers leak. The
# 421 Misdirected Request response is the explicit "wrong vhost" signal.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Use the same cert (nginx requires SOME cert for the default ssl server,
    # even if we 421 immediately). Reusing the real cert is fine since we
    # never serve content here.
    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    return 421;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/DOMAIN/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Slowloris defense: reject clients that drip-feed headers/body.
    # Without these, an attacker can hold thousands of nginx workers open
    # by sending 1 byte every 30 seconds, exhausting connection slots.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    keepalive_timeout     30s;
    keepalive_requests    100;
    # Reject oversized headers (default 1KB is fine; 8KB allows a few cookies
    # and standard auth headers without enabling header smuggling).
    large_client_header_buffers 4 8k;
    # Per-IP connection cap (zone defined in conf.d/lyaotalk-rate-limit.conf).
    limit_conn conn_per_ip 50;

    server_tokens off;
    # Rate-limit responses: nginx defaults to 503 for limit_req exceedance.
    # 429 (Too Many Requests) is the correct status — clients (including our
    # frontend axios interceptor) treat 503 as "server down, retry later"
    # but 429 as "you're going too fast, back off". Same goes for limit_conn.
    limit_req_status 429;
    limit_conn_status 429;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # X-XSS-Protection is deprecated and can be exploited on legacy browsers
    # (it's a no-op in modern Chrome/Firefox; Safari still honors it). The
    # CSP below replaces what little protection it offered.
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Cross-Origin-Resource-Policy: prevent other sites from embedding our
    # resources via <img>/<script>/<iframe>. Combined with COOP, this gives
    # us same-origin process isolation.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # CSP — content security policy
    # ---------------------------------------------------------------------
    # script-src 'self': no inline scripts, no eval, no remote scripts.
    #   Vite produces external .js bundles only. Anything trying to inline
    #   a <script> is a sign of XSS.
    # connect-src: API, WebSocket (XMPP-over-WS), and Web Push.
    # img-src 'self' blob:: avatars and inline previews come either from
    #   our own /files/ proxy ('self') or are decrypted in-memory blobs
    #   (blob:). data: URIs are intentionally NOT allowed in img-src
    #   because data:image/svg+xml can carry executable script handlers
    #   (<svg onload="...">) — defense in depth even though urlSafety.ts
    #   already filters at render time. Map tiles are served by this origin.
    # style-src-attr 'unsafe-inline': React's `style={...}` prop uses the
    #   `style=` attribute, which is governed by style-src-attr.
    # style-src-elem 'unsafe-inline': some UI libraries inject runtime
    #   <style> tags for measured layouts; keep this scoped to style elements.
    # worker-src 'self': service worker for PWA + offline support.
    # manifest-src 'self': PWA manifest.json.
    # frame-src 'none', frame-ancestors 'self': we never embed external
    #   pages, and only same-origin pages can frame us.
    # form-action 'self': forms can only post back to our own origin
    #   (defense against form-action redirection abuse on XSS).
    # base-uri 'self': prevent <base href="..."> injection from rewriting
    #   relative URLs site-wide.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' wss://$host https://$host https://fcm.googleapis.com https://updates.push.services.mozilla.com https://web.push.apple.com; img-src 'self' blob:; style-src 'self'; style-src-attr 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; font-src 'self' data:; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'; frame-ancestors 'self'; form-action 'self'; report-uri /api/csp-report; report-to csp-endpoint;" always;
    # Reporting endpoint declaration (newer reporting API)
    add_header Reporting-Endpoints "csp-endpoint=\"/api/csp-report\"" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    client_max_body_size 110m;

    root INSTALL_DIR/web/dist;
    index index.html;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$) {
        return 405;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/map/tiles/[0-9]+/[0-9]+/[0-9]+\.png$ {
        limit_req zone=api_general burst=50 nodelay;
        rewrite ^/map/tiles/([0-9]+)/([0-9]+)/([0-9]+)\.png$ /$1/$2/$3.png break;
        proxy_pass https://tile.openstreetmap.org;
        proxy_ssl_server_name on;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "LyaoTalk/2.3.6 (+https://lyaot.2-yc.com)";
        proxy_set_header Referer "https://lyaot.2-yc.com/";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache lyaotalk_osm;
        proxy_cache_valid 200 7d;
        proxy_cache_valid any 1m;
        proxy_cache_lock on;
        proxy_read_timeout 20s;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon.ico {
        return 302 /favicon.svg;
    }

    location ~* \.(js|css|woff|woff2|ttf|svg|ico|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ ^/api/auth/admin/login/?$ {
        # Tightest rate limit on the credential endpoint. burst=10 allows a
        # handful of close-spaced retries from a real user fixing typos
        # without 429-ing them; nodelay rejects spam beyond that immediately.
        # Regex match (with optional trailing slash) prevents a bypass where
        # a brute-forcer hits /api/auth/admin/login/ (which an exact-match
        # `=` location would route through the looser /api/ limit, since
        # FastAPI does the trailing-slash redirect AFTER nginx routing).
        limit_req zone=api_auth burst=10 nodelay;
        # Strip exactly one trailing slash so the upstream sees the canonical path.
        rewrite ^/api/auth/admin/login/?$ /auth/admin/login break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Don't let a slow-reading attacker hold the auth endpoint open.
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
    }


    # Prometheus scrape endpoint — restrict to local/private monitoring hosts.
    # If your Prometheus runs elsewhere, add its private IP/CIDR here before deploy.
    location = /api/metrics {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8000/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep attachment URLs under the API router even when their object keys
    # end in a static-file extension such as .png or .jpg.
    location ^~ /api/attachments/ {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://127.0.0.1:8000/attachments/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        # Loose rate limit for general API. burst=50 absorbs page-load bursts
        # (a chat app loads conversations + roster + presence in parallel)
        # without flagging legit users.
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # API documentation — restrict to localhost in production
    # Remove the allow/deny lines to make docs public
    location /api/docs {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    location /api/redoc {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_set_header Host $host;
    }

    location /api/openapi.json {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /xmpp-websocket {
        proxy_pass http://127.0.0.1:5280/xmpp-websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /http-bind {
        proxy_pass http://127.0.0.1:5280/http-bind;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /files/ {
        # Files are referenced by random UUIDv4 object keys — 122 bits of entropy
        # makes guessing impractical. For real privacy, clients should use
        # XEP-0454 (aesgcm://) which encrypts the file before upload so the
        # URL is opaque ciphertext requiring a key to decrypt.
        #
        # NOTE: this location is intentionally NOT auth_request-gated, because
        # peers on other XMPP servers receive the URL and must be able to
        # download it. If you need auth-gated access for personal files only,
        # see /api/attachments/presign which DOES enforce ownership.
        proxy_pass http://127.0.0.1:8000/attachments/download/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Don't let upstream/CDN cache responses publicly — UUIDs are private-by-obscurity
        # but cached files at CDN edges would survive deletion and outlive their owners.
        expires off;
        add_header Cache-Control "private, no-store" always;

        # CRITICAL: prevent uploaded HTML/SVG/JS from rendering as same-origin
        # active content. Without these headers, an attacker uploads
        # `evil.html` with Content-Type:text/html, sends the /files/UUID link
        # to a victim via XMPP, victim clicks, browser renders the HTML in
        # OUR origin, and the attacker's JavaScript runs with the victim's
        # session cookies / localStorage / API access. Same applies to SVG
        # (which can carry <script>) and any other active type.
        #
        # X-Content-Type-Options: nosniff stops the browser from second-
        # guessing Content-Type — useful on top of the override below.
        # Content-Disposition: attachment forces download semantics regardless
        # of Content-Type, so the file lands in Downloads instead of being
        # rendered. We use proxy_hide_header to STRIP MinIO's own value
        # (which would echo the user-supplied attachment-or-inline) and
        # then add_header to set our own.
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /minio-console/ {
        # Console exposes the MinIO admin UI which can list/delete every bucket.
        # Restrict to localhost — admins should use an SSH tunnel:
        #   ssh -L 9001:127.0.0.1:9001 user@server
        # Then visit http://localhost:9001 directly.
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:9001/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /api/health {
        proxy_pass http://127.0.0.1:8000/api/health;
        access_log off;
    }
}
