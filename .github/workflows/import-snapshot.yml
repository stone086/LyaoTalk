name: Import Lyao Talk source snapshot

on:
  push:
    paths:
      - .github/workflows/import-snapshot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out new LyaoTalk repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check out frozen LiaoT source snapshot (no Git history copied)
        uses: actions/checkout@v4
        with:
          repository: stone086/LiaoT
          ref: 663c6881c379b4392a22878dd38920c5f4d77ba5
          path: legacy-source
          persist-credentials: false
      - name: Import source without old history or deploy workflows
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/legacy-source/' \
            --exclude='/.github/workflows/' \
            --exclude='/README.md' \
            --exclude='/CHANGELOG.md' \
            --exclude='/.env' \
            --exclude='/.env.*' \
            legacy-source/ ./
          rm -rf legacy-source
          cat > README.md <<'EOF'
          # Lyao Talk

          **More Than Just Chat.**

          Lyao Talk is an XMPP-based web messaging app. This repository starts with an independent Git history. It imports a source-code snapshot without any prior LiaoT commits, pull requests, issues or tags.

          ## Development

          - Frontend: `apps/web` (React, TypeScript, Vite)
          - Backend: `apps/api` (FastAPI)
          - Messaging server: Prosody

          Run `npm --prefix apps/web ci`, `npm --prefix apps/web run build`, and `npm --prefix apps/web test` to validate the frontend.

          **Deployment status:** source import only. Production and CI configuration must be reviewed before deployment. The original live LiaoT service remains unchanged.
          EOF
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import messaging application snapshot without legacy history'
          git push origin HEAD:main
